name: Build S6 Kernel (FTS touch fix)

# 在 GitHub 云端编译步步高 S6 内核，修复 FocalTech 触摸 90Hz 失效
# 用法：把本文件放到 fork 仓库的 .github/workflows/ 下，然后手动触发

on:
  workflow_dispatch:      # 手动触发
  push:
    branches: [ android-11 ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential bc bison flex libssl-dev libelf-dev \
            python3 cpio rsync device-tree-compiler \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            lz4 zstd zip
          echo "=== toolchain ==="
          aarch64-linux-gnu-gcc --version | head -1

      - name: Patch FocalTech touch driver
        run: |
          FTS=drivers/input/touchscreen/focaltech_touch/focaltech_core.c
          echo "=== 原始 reset_proc ==="
          grep -A6 'int fts_reset_proc' $FTS

          # 修复1: 复位低电平 1ms -> 20ms
          perl -0pi -e 's/(gpio_direction_output\(fts_data->pdata->reset_gpio, 0\);\s*\n\s*)msleep\(1\);/${1}msleep(20);/g' $FTS

          # 修复2+3: resume 返回值检查重试 + 强制 ACTIVE
          python3 - "$FTS" <<'PYEOF'
          import sys
          p = sys.argv[1]
          s = open(p, encoding='utf-8', errors='replace').read()
          old = """    fts_reset_proc(200);
              fts_wait_tp_to_valid();
              fts_ex_mode_recovery(ts_data);"""
          # 兼容不同缩进
          import re
          m = re.search(r'( *)fts_reset_proc\(200\);\s*\n\s*fts_wait_tp_to_valid\(\);\s*\n\s*fts_ex_mode_recovery\(ts_data\);', s)
          if not m:
              print("WARN: resume 代码段未匹配")
              sys.exit(0)
          ind = m.group(1)
          new = f"""{ind}fts_reset_proc(200);

          {ind}/* FIX: 原代码忽略返回值，超时也当成功继续执行 -> IC 未就绪却启用中断 */
          {ind}{{
          {ind}    int retry, wret = -1;
          {ind}    for (retry = 0; retry < 3; retry++) {{
          {ind}        wret = fts_wait_tp_to_valid();
          {ind}        if (wret == 0)
          {ind}            break;
          {ind}        pr_err("[FTS_FIX] resume: tp not valid, retry %d/3\\n", retry + 1);
          {ind}        fts_reset_proc(300);
          {ind}    }}
          {ind}    if (wret != 0)
          {ind}        pr_err("[FTS_FIX] resume: tp still not valid after retries\\n");
          {ind}}}

          {ind}/* FIX: suspend 写过 POWER_MODE=SLEEP，复位可能未清掉 -> 强制拉回 ACTIVE */
          {ind}{{
          {ind}    int pret = fts_write_reg(FTS_REG_POWER_MODE, 0x00);
          {ind}    if (pret < 0)
          {ind}        pr_err("[FTS_FIX] resume: force POWER_MODE=ACTIVE failed (%d)\\n", pret);
          {ind}}}

          {ind}fts_ex_mode_recovery(ts_data);"""
          s = s[:m.start()] + new + s[m.end():]
          open(p,'w',encoding='utf-8').write(s)
          print("OK: resume 已打补丁")
          PYEOF

          echo "=== 补丁后检查 ==="
          grep -n 'FTS_FIX\|msleep(20)' $FTS | head -10

      - name: Apply kernel config
        run: |
          if [ -f config/kernel.config ]; then
            cp config/kernel.config .config
            echo "使用仓库内 config: $(wc -l < .config) 行"
          else
            echo "!! 未找到 config/kernel.config"
            ls -la config/ 2>/dev/null || true
            exit 1
          fi
          grep -E 'CONFIG_LOCALVERSION|CONFIG_TOUCHSCREEN_FTS' .config

      - name: Build kernel
        run: |
          set -o pipefail          # 关键：让 make 的退出码穿透管道，失败即失败
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          # 4.14 老内核用 GCC 11 编译会遇到新版 -Werror 检查（如 designated-init），
          # 设备出厂用 clang 12 无此问题。这里放宽为警告，避免编译中断。
          make -j$(nproc) ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
               KCFLAGS="-Wno-error -Wno-designated-init" \
               Image.gz-dtb 2>&1 | tee build_full.log
          echo "=== 产物 ==="
          ls -la arch/arm64/boot/ | grep -iE 'image|dtb' || echo "无产物"

      # 无论成败都上传完整日志，便于定位错误
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build_full.log
          if-no-files-found: warn
          retention-days: 7

      - name: Show errors on failure
        if: failure()
        run: |
          echo "===== 编译错误摘要 ====="
          grep -nE 'error:|Error [0-9]|undefined reference|No such file' build_full.log 2>/dev/null | head -60 || echo "未匹配到错误行"

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: s6-kernel-fts-fix
          path: |
            arch/arm64/boot/Image.gz-dtb
            arch/arm64/boot/Image.gz
            arch/arm64/boot/Image
          if-no-files-found: warn
          retention-days: 30
