name: Build S6 Kernel (FTS touch fix)

# 基于原厂 build-H130.yml 的构建配置（clang r416183b + defconfig），
# 仅插入 FocalTech 触摸驱动补丁以修复 90Hz 下触摸失效。
# 原厂用 clang 编译，避免 GCC 11 对 4.14 内核的编译期断言误报。

on:
  workflow_dispatch:

jobs:
  build:
    name: build
    runs-on: ubuntu-22.04
    steps:

      - name: Get branch name
        id: branch-names
        uses: tj-actions/branch-names@v8

      - name: Setting up SWAP
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 5

      - name: Configure Fast APT Mirror
        uses: vegardit/fast-apt-mirror.sh@v1

      - name: Prepare environment
        run: |
          sudo apt-get update
          sudo apt-get install -yqq bison build-essential device-tree-compiler flex \
            gcc-aarch64-linux-gnu python3 python3-dev python3-venv swig \
            libssl-dev libelf-dev bc cpio rsync lz4 zip
          mkdir -p $GITHUB_WORKSPACE/workdir
          cd $GITHUB_WORKSPACE/workdir
          echo "BUILD_TIME=$(TZ=Asia/Shanghai date "+%Y%m%d%H%M")" >> $GITHUB_ENV

      - name: Get clang toolchain
        run: |
          git clone https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b --depth 1 $GITHUB_WORKSPACE/workdir/clang

      - name: Get gcc toolchain
        run: |
          git clone https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 -b lineage-19.1 --depth=1 $GITHUB_WORKSPACE/workdir/gcc

      - name: Clone kernel source
        run: |
          git clone --recursive https://github.com/$GITHUB_REPOSITORY/ -b ${{ steps.branch-names.outputs.current_branch }} --depth 1 $GITHUB_WORKSPACE/workdir/source

      - name: Setting up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
         key: build-kernel-mido-kernel
         max-size: 2G

      # ============ 关键步骤：触摸驱动补丁 ============
      - name: Patch FocalTech touch driver
        run: |
          cd $GITHUB_WORKSPACE/workdir/source
          FTS=drivers/input/touchscreen/focaltech_touch/focaltech_core.c
          echo "=== 原始 fts_reset_proc ==="
          grep -A7 'int fts_reset_proc' $FTS

          python3 - "$FTS" <<'PYEOF'
import sys, re
p = sys.argv[1]
s = open(p, encoding='utf-8', errors='replace').read()
orig = s

# ---- 修复1: 复位低电平 1ms -> 20ms ----
pat1 = re.compile(r'(gpio_direction_output\(fts_data->pdata->reset_gpio,\s*0\);\s*\n\s*)msleep\(1\);')
if pat1.search(s):
    s = pat1.sub(r'\1msleep(20);  /* FTS_FIX: FocalTech 要求复位低电平 >=10ms */', s, count=1)
    print("[OK] 修复1: 复位低电平 1ms -> 20ms")
else:
    print("[WARN] 修复1 未匹配")

# ---- 修复2+3: resume 返回值重试 + 强制 POWER_MODE=ACTIVE ----
m = re.search(r'( *)fts_reset_proc\(200\);\s*\n\s*fts_wait_tp_to_valid\(\);\s*\n\s*fts_ex_mode_recovery\(ts_data\);', s)
if m:
    ind = m.group(1)
    new = (
f"""{ind}fts_reset_proc(200);

{ind}/* FTS_FIX: 原代码忽略 fts_wait_tp_to_valid() 返回值，超时也当成功继续执行，
{ind} * 导致 IC 未真正就绪却启用了中断（现象：日志报 TP Ready 但触摸不报点）。 */
{ind}{{
{ind}    int retry, wret = -1;
{ind}    for (retry = 0; retry < 3; retry++) {{
{ind}        wret = fts_wait_tp_to_valid();
{ind}        if (wret == 0)
{ind}            break;
{ind}        pr_err("[FTS_FIX] resume: tp not valid, retry %d/3\\n", retry + 1);
{ind}        fts_reset_proc(300);
{ind}    }}
{ind}    if (wret != 0)
{ind}        pr_err("[FTS_FIX] resume: tp still not valid after 3 retries\\n");
{ind}}}

{ind}/* FTS_FIX: suspend 时写过 POWER_MODE=SLEEP(0x03)，若复位未清掉该状态，
{ind} * IC 会保持睡眠：I2C 可读 ChipID 但不扫描报点。强制拉回 ACTIVE。 */
{ind}{{
{ind}    int pret = fts_write_reg(FTS_REG_POWER_MODE, 0x00);
{ind}    if (pret < 0)
{ind}        pr_err("[FTS_FIX] resume: force POWER_MODE=ACTIVE failed (%d)\\n", pret);
{ind}}}

{ind}fts_ex_mode_recovery(ts_data);"""
    )
    s = s[:m.start()] + new + s[m.end():]
    print("[OK] 修复2+3: resume 重试 + 强制 ACTIVE")
else:
    print("[WARN] 修复2 未匹配")

if s != orig:
    open(p, 'w', encoding='utf-8').write(s)
    print("补丁已写入")
else:
    print("!! 未产生任何修改")
PYEOF

          echo "=== 补丁验证 ==="
          grep -n 'FTS_FIX' $FTS | head -8
          grep -n 'msleep(20)' $FTS | head -3
      # ============ 补丁结束 ============

      - name: Build kernel
        run: |
          export KBUILD_BUILD_HOST=Github-Action
          export KBUILD_BUILD_USER=$(echo ${{ github.actor }})
          export ARCH="arm64"
          export SUBARCH="arm64"
          export CROSS_COMPILE="aarch64-linux-android-"
          export CLANG_TRIPLE="aarch64-linux-gnu-"
          export PATH="$GITHUB_WORKSPACE/workdir/clang/bin:$GITHUB_WORKSPACE/workdir/gcc/bin/:$PATH"
          export TARGET_PRODUCT=sm6150

          cd $GITHUB_WORKSPACE/workdir/source
          make -j$(nproc --all) O=out CC=clang LD=ld.lld vendor/sdmsteppe-perf_defconfig h130.config
          make -j$(nproc --all) O=out CC=clang DTC=dtc LD=ld.lld 2>&1 | tee kernel.log

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel_log_${{ env.BUILD_TIME }}
          path: workdir/source/kernel.log
          if-no-files-found: warn

      - name: Show errors
        if: failure()
        run: |
          echo "===== 错误摘要 ====="
          grep -nE 'error:|Error [0-9]|undefined reference' workdir/source/kernel.log 2>/dev/null | head -50 || echo "无匹配"

      - name: Check kernel file
        id: check
        run: |
          cd $GITHUB_WORKSPACE/workdir
          if [ -f source/out/arch/arm64/boot/Image.gz ]; then
              echo "CHECK_FILE_IS_OK=true" >> $GITHUB_ENV
              ls -la source/out/arch/arm64/boot/Image.gz
          else
              echo "Kernel output file is empty"
              exit 1
          fi

      - name: Upload Image file
        if: env.CHECK_FILE_IS_OK == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Image-gz-4.14
          path: workdir/source/out/arch/arm64/boot/Image.gz

      - name: Upload dtbs file
        if: env.CHECK_FILE_IS_OK == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dtbs-4.14
          path: workdir/source/out/arch/arm64/boot/dts/eebbk-qcom/sdmmagpie*
          if-no-files-found: warn
